{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CampusHub{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🎓 CampusHub
        </div>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'courses' %}">Courses</a>
            <a href="{% url 'departments' %}">Departments</a>
            <a href="/admin/">Admin</a>
        </div>

    </nav>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>© 2026 CampusHub — University Student Portal</p>
    </footer>

</body>

</html>
